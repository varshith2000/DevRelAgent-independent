[project]
name = "devrel-agent"
version = "0.1.0"
description = "24/7 AI-Powered Developer Relations Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === Core ===
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",

    # === LLM Providers (multi-provider support) ===
    "anthropic>=0.45.0",          # Default LLM provider
    "openai>=1.30.0",             # Optional: OpenAI GPT-4o
    "google-genai>=1.0.0",        # Optional: Google Gemini

    # === Vector Search & Embeddings ===
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "requests>=2.31.0",           # For Ollama embeddings API

    # === Code Parsing (AST) ===
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Optional language parsers (install as needed):
    # tree-sitter-javascript, tree-sitter-typescript, tree-sitter-java
    # tree-sitter-rust, tree-sitter-go, tree-sitter-c, tree-sitter-cpp

    # === MCP Protocol ===
    "mcp>=1.0.0",

    # === Git ===
    "gitpython>=3.1.0",

    # === Terminal UI ===
    "rich>=13.0.0",

    # === Web / CORS ===
    "sse-starlette>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",               # For FastAPI test client
]
docs = [
    # For team: document indexing dependencies
    "pymupdf4llm>=0.0.21",         # PDF extraction
    "markitdown[all]>=0.1.1",      # Word/doc conversion
    "pillow>=11.0.0",              # Image OCR support
    "trafilatura[all]>=2.0.0",     # Web scraping
]

[tool.setuptools.packages.find]
where = ["apps/backend"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
