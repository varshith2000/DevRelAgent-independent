name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend + dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check apps/backend tests

      - name: Format check (black)
        run: >
          black --check
          apps/backend/config apps/backend/observability
          apps/backend/auth apps/backend/db apps/backend/sessions
          apps/backend/shared apps/backend/alembic apps/backend/limits
          apps/backend/routes/workspaces.py apps/backend/routes/identity.py
          tests/conftest.py tests/test_tenancy tests/test_limits

      - name: Type check (mypy)
        run: mypy

      - name: Migrations apply cleanly (SQLite)
        working-directory: apps/backend
        env:
          DATABASE_URL: sqlite:////tmp/devrelagent_ci.db
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest -m "not integration"

      - name: Dependency audit (informational)
        continue-on-error: true
        run: pip-audit || true

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
