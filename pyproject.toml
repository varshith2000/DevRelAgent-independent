[project]
name = "devrel-agent"
version = "0.1.0"
description = "24/7 AI-Powered Developer Relations Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === Core ===
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # === LLM Providers (multi-provider support) ===
    "anthropic>=0.45.0", # Default LLM provider
    "openai>=1.30.0", # Optional: OpenAI GPT-4o, also used for z.ai GLM
    "google-genai>=1.0.0", # Optional: Google Gemini
    # === Vector Search & Embeddings ===
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "requests>=2.31.0", # For Ollama embeddings API
    # === Code Parsing (AST) ===
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Optional language parsers (install as needed):
    # tree-sitter-javascript, tree-sitter-typescript, tree-sitter-java
    # tree-sitter-rust, tree-sitter-go, tree-sitter-c, tree-sitter-cpp
    # === MCP Protocol ===
    "mcp>=1.0.0",
    # === Git ===
    "gitpython>=3.1.0",
    # === Terminal UI ===
    "rich>=13.0.0",
    # === Web / CORS ===
    "sse-starlette>=2.3.0",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.1",
    "unstructured>=0.20.8",
    "clickhouse-connect>=0.13.0",
    "sqlparse>=0.5.5",
    "apscheduler>=3.11.2",
    # === Phase 1: system of record + identity ===
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",   # Postgres/Supabase driver for the system of record
    "pyjwt[crypto]>=2.8.0",   # verifies Clerk/OIDC ID tokens
    "redis>=5.0.0",           # shared session/rate-limit store (optional at runtime)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",               # For FastAPI test client
    "ruff>=0.6.0",                 # Linter + import sorter
    "black>=24.0.0",               # Formatter
    "mypy>=1.11.0",                # Static type checker
    "pip-audit>=2.7.0",            # Dependency vulnerability scan
]
docs = [
    # For team: document indexing dependencies
    "pymupdf4llm>=0.0.21",         # PDF extraction
    "markitdown[all]>=0.1.1",      # Word/doc conversion
    "pillow>=11.0.0",              # Image OCR support
    "trafilatura[all]>=2.0.0",     # Web scraping
]

[tool.setuptools.packages.find]
where = ["apps/backend"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ================================================================
# Tooling
# ================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "__pycache__", "node_modules", ".next"]

[tool.ruff.lint]
# Lenient starting baseline: correctness (F), import sorting (I) and a subset
# of pycodestyle/pyflakes. Tighten over time by adding rule families.
select = ["F", "I", "E9"]
ignore = [
    "E501",  # line length is handled by black
    "F401",  # unused imports: tracked as a follow-up sweep, not a build blocker
    "F841",  # local variable assigned but never used (legacy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | __pycache__
  | node_modules
  | \.next
)/
'''

[tool.mypy]
python_version = "3.11"
mypy_path = "apps/backend"

# Baseline: type-check the new central config package. Legacy modules are
# added to this list as they are annotated (tracked in the plan, Phase 8).
files = [
    "apps/backend/config",
    "apps/backend/db",
    "apps/backend/auth",
    "apps/backend/sessions",
    "apps/backend/shared",
    "apps/backend/observability",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
