# Local development stack.
#
# Prerequisites: copy `apps/backend/.env.example` to `apps/backend/.env` and set
# your LLM provider key, otherwise the backend will (correctly) refuse to start.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: devrelagent-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: devrelagent-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector - receives traces/metrics/logs from your services
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: devrelagent-otel-collector
    command: --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver (default for most SDKs)
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector metrics
      - "8889:8889"   # Prometheus exporter
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devrelagent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: logs
      OTEL_ENDPOINT: otel-collector:4317
      HOST: 0.0.0.0
      PORT: "8000"
      # System of record + shared session store (Phase 1).
      DATABASE_URL: postgresql+psycopg://devrel:devrel@postgres:5432/devrel
      DATABASE_AUTO_CREATE: "true"
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: devrelagent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Application data stores (system of record, used from Phase 1) ──
  postgres:
    image: postgres:16-alpine
    container_name: devrelagent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devrel
      POSTGRES_PASSWORD: devrel
      POSTGRES_DB: devrel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devrelagent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local
  postgres_data:
    driver: local
